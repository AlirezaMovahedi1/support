name: Knowledge Base Validation & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-dotenv

    - name: Run Knowledge Base consistency tests
      run: |
        python test_kb.py

    - name: Run simple routing tests
      run: |
        python test_bot.py
